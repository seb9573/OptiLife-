<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OptiLife V10.1</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f6f8;
    color: #17202a;
}

header {
    background: #111827;
    color: white;
    padding: 22px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 6px 0 0;
    opacity: 0.75;
}

.container {
    max-width: 900px;
    margin: 25px auto;
    padding: 0 18px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.07);
}

h2 {
    margin-top: 0;
}

.task {
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 12px;
}

.task-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.task-name {
    font-weight: 700;
    font-size: 17px;
}

.task-info {
    color: #6b7280;
    margin-top: 6px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.primary {
    background: #111827;
    color: white;
}

.secondary {
    background: #e5e7eb;
    color: #111827;
}

.danger {
    background: #fee2e2;
    color: #991b1b;
}

input, select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #d1d5db;
    margin-top: 6px;
    margin-bottom: 12px;
    font-size: 15px;
}

label {
    font-weight: 600;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.plan-item {
    display: flex;
    justify-content: space-between;
    padding: 15px;
    border-bottom: 1px solid #eee;
}

.plan-item:last-child {
    border-bottom: none;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.stat {
    background: #f3f4f6;
    padding: 15px;
    border-radius: 14px;
    text-align: center;
}

.stat-number {
    font-size: 23px;
    font-weight: 800;
}

.stat-label {
    color: #6b7280;
    font-size: 13px;
}

.alert {
    background: #fff7ed;
    border: 1px solid #fed7aa;
    border-radius: 14px;
    padding: 18px;
    margin-top: 15px;
}

.hidden {
    display: none;
}

.empty {
    text-align: center;
    color: #6b7280;
    padding: 25px;
}

@media (max-width: 650px) {

    .grid {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .plan-item {
        flex-direction: column;
        gap: 5px;
    }

}

</style>
</head>

<body>

<header>

    <h1>🧠 OptiLife</h1>

    <p>Your day. Optimised.</p>

</header>


<div class="container">


<!-- =====================================================
     SETUP
====================================================== -->

<div class="card">

    <h2>🌅 Plan your day</h2>

    <div class="grid">

        <div>

            <label>
                Available time (minutes)
            </label>

            <input
                id="availableTime"
                type="number"
                value="420"
                min="1"
            >

        </div>


        <div>

            <label>
                Transport
            </label>

            <select id="transport">

                <option value="walking">
                    🚶 Walking
                </option>

                <option value="cycling">
                    🚲 Cycling
                </option>

                <option value="driving">
                    🚗 Driving
                </option>

                <option value="public">
                    🚌 Public transport
                </option>

            </select>

        </div>

    </div>

</div>


<!-- =====================================================
     ADD TASK
====================================================== -->

<div class="card">

    <h2>➕ Add a task</h2>

    <div class="grid">

        <div>

            <label>
                Task name
            </label>

            <input
                id="taskName"
                placeholder="e.g. Gym"
            >

        </div>


        <div>

            <label>
                Location
            </label>

            <select id="taskLocation">

                <option>Gym</option>

                <option>Shop</option>

                <option>Cafe</option>

                <option>Library</option>

                <option>Park</option>

                <option>Cinema</option>

                <option>School</option>

            </select>

        </div>


        <div>

            <label>
                Duration (minutes)
            </label>

            <input
                id="taskDuration"
                type="number"
                value="30"
                min="1"
            >

        </div>


        <div>

            <label>
                Priority (1–10)
            </label>

            <input
                id="taskPriority"
                type="number"
                value="5"
                min="1"
                max="10"
            >

        </div>

    </div>


    <label>

        <input
            id="mandatory"
            type="checkbox"
            style="width:auto"
        >

        Mandatory task

    </label>

    <br><br>

    <button
        class="primary"
        onclick="addTask()"
    >

        ➕ Add task

    </button>

</div>


<!-- =====================================================
     TASK LIST
====================================================== -->

<div class="card">

    <h2>📋 Your tasks</h2>

    <div id="taskList">

        <div class="empty">
            No tasks yet.
        </div>

    </div>

</div>


<!-- =====================================================
     OPTIMISE
====================================================== -->

<div class="card">

    <button
        class="primary"
        style="width:100%; font-size:18px;"
        onclick="optimise()"
    >

        🚀 OPTIMISE MY DAY

    </button>

</div>


<!-- =====================================================
     RESULT
====================================================== -->

<div
    id="result"
    class="card hidden"
>

    <h2>🧠 Your optimal plan</h2>

    <div
        id="planList"
    ></div>


    <div class="stats">

        <div class="stat">

            <div
                class="stat-number"
                id="totalTime"
            >
                0m
            </div>

            <div class="stat-label">
                Total time
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="travelTime"
            >
                0m
            </div>

            <div class="stat-label">
                Travel
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="cost"
            >
                €0
            </div>

            <div class="stat-label">
                Cost
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="saved"
            >
                0m
            </div>

            <div class="stat-label">
                Time saved
            </div>

        </div>

    </div>


    <br>

    <button
        class="secondary"
        onclick="simulateDelay()"
    >

        ⏰ I'm running late

    </button>


    <button
        class="secondary"
        onclick="sharePlan()"
    >

        📤 Share

    </button>


    <div
        id="delayAlert"
        class="alert hidden"
    >

        <strong>
            ⚠️ You're running behind!
        </strong>

        <p id="delayText"></p>

        <button
            class="primary"
            onclick="reoptimise()"
        >

            🔄 Re-optimise

        </button>

    </div>

</div>


</div>


<script>


/* =========================================================
   DATA
========================================================= */

let tasks = [];

let currentPlan = [];

let originalTime = 0;


/* =========================================================
   ADD TASK
========================================================= */

function addTask() {

    const name =
        document
        .getElementById("taskName")
        .value
        .trim();

    const location =
        document
        .getElementById("taskLocation")
        .value;

    const duration =
        Number(
            document
            .getElementById("taskDuration")
            .value
        );

    const priority =
        Number(
            document
            .getElementById("taskPriority")
            .value
        );

    const mandatory =
        document
        .getElementById("mandatory")
        .checked;


    if (!name) {

        alert(
            "Please enter a task name."
        );

        return;

    }


    if (
        duration <= 0
    ) {

        alert(
            "Duration must be greater than 0."
        );

        return;

    }


    tasks.push({

        name,
        location,
        duration,
        priority,
        mandatory

    });


    document
        .getElementById("taskName")
        .value = "";


    renderTasks();

}


/* =========================================================
   RENDER TASKS
========================================================= */

function renderTasks() {

    const list =
        document
        .getElementById("taskList");


    if (
        tasks.length === 0
    ) {

        list.innerHTML =
            '<div class="empty">No tasks yet.</div>';

        return;

    }


    list.innerHTML = "";


    tasks.forEach(
        (task, index) => {

            const div =
                document
                .createElement("div");

            div.className =
                "task";


            div.innerHTML = `

                <div class="task-top">

                    <div>

                        <div class="task-name">

                            ${task.name}

                        </div>

                        <div class="task-info">

                            📍 ${task.location}

                            • ⏱️ ${task.duration} min

                            • ⭐ ${task.priority}

                        </div>

                    </div>


                    <button
                        class="danger"
                        onclick="removeTask(${index})"
                    >

                        ✕

                    </button>

                </div>

            `;


            list.appendChild(div);

        }
    );

}


/* =========================================================
   REMOVE TASK
========================================================= */

function removeTask(index) {

    tasks.splice(
        index,
        1
    );

    renderTasks();

}


/* =========================================================
   SIMPLE TRAVEL ESTIMATION
========================================================= */

function travelTime(
    from,
    to
) {

    if (
        from === to
    ) {

        return 0;

    }


    const transport =
        document
        .getElementById("transport")
        .value;


    const speeds = {

        walking: 5,

        cycling: 16,

        driving: 35,

        public: 25

    };


    const baseDistance = 2;


    let distance =
        baseDistance;


    if (
        transport === "driving"
    ) {

        distance *= 1.35;

    }


    return Math.ceil(

        distance
        /
        speeds[transport]
        *
        60

    );

}


/* =========================================================
   OPTIMISER
========================================================= */

function optimise() {

    if (
        tasks.length === 0
    ) {

        alert(
            "Add at least one task first!"
        );

        return;

    }


    const available =
        Number(
            document
            .getElementById("availableTime")
            .value
        );


    /*
        Simple priority-aware
        greedy optimiser.

        This is the UI prototype.

        Our full V10 Python engine
        can later replace this.
    */


    let remaining =
        [...tasks];


    remaining.sort(
        (a, b) => {

            if (
                a.mandatory
                !==
                b.mandatory
            ) {

                return a.mandatory
                    ? -1
                    : 1;

            }

            return (
                b.priority
                -
                a.priority
            );

        }
    );


    let time = 0;

    let travel = 0;

    let plan = [];


    for (
        let task
        of remaining
    ) {

        const last =
            plan.length === 0
            ? "Home"
            : plan[
                plan.length - 1
            ].location;


        const travelMinutes =
            travelTime(
                last,
                task.location
            );


        const needed =
            travelMinutes
            +
            task.duration;


        if (
            time + needed
            <=
            available
        ) {

            time += needed;

            travel +=
                travelMinutes;


            plan.push({

                ...task,

                travelMinutes

            });

        }

    }


    currentPlan =
        plan;


    originalTime =
        time;


    displayPlan(
        plan,
        time,
        travel,
        available
    );

}


/* =========================================================
   DISPLAY PLAN
========================================================= */

function displayPlan(
    plan,
    time,
    travel,
    available
) {

    const result =
        document
        .getElementById("result");


    result.classList.remove(
        "hidden"
    );


    const list =
        document
        .getElementById("planList");


    list.innerHTML = "";


    plan.forEach(
        (task, index) => {

            const div =
                document
                .createElement("div");


            div.className =
                "plan-item";


            div.innerHTML = `

                <div>

                    <strong>
                        ${index + 1}.
                        ${task.name}
                    </strong>

                    <br>

                    📍 ${task.location}

                </div>


                <div>

                    ⏱️ ${task.duration}m

                    <br>

                    🚗 ${task.travelMinutes}m

                </div>

            `;


            list.appendChild(div);

        }
    );


    document
        .getElementById("totalTime")
        .textContent =
            formatMinutes(time);


    document
        .getElementById("travelTime")
        .textContent =
            formatMinutes(travel);


    document
        .getElementById("cost")
        .textContent =
            "€" +
            (
                plan.length * 1.50
            ).toFixed(2);


    const saved =
        Math.max(
            0,
            available - time
        );


    document
        .getElementById("saved")
        .textContent =
            formatMinutes(saved);

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatMinutes(
    minutes
) {

    if (
        minutes < 60
    ) {

        return minutes + "m";

    }


    const hours =
        Math.floor(
            minutes / 60
        );


    const mins =
        minutes % 60;


    return (
        hours +
        "h " +
        mins +
        "m"
    );

}


/* =========================================================
   DELAY
========================================================= */

function simulateDelay() {

    if (
        currentPlan.length === 0
    ) {

        return;

    }


    const delay = 25;


    document
        .getElementById("delayText")
        .textContent =

        `You are ${delay} minutes longer than expected.`;

    
    document
        .getElementById("delayAlert")
        .classList.remove(
            "hidden"
        );

}


/* =========================================================
   RE-OPTIMISE
========================================================= */

function reoptimise() {

    const newTime =
        prompt(
            "How many minutes will you take?"
        );


    if (
        newTime === null
    ) {

        return;

    }


    const minutes =
        Number(newTime);


    if (
        !Number.isFinite(minutes)
        ||
        minutes < 0
    ) {

        alert(
            "Please enter a valid number."
        );

        return;

    }


    /*
        Remove the first task
        because we pretend it
        has already happened.
    */

    if (
        currentPlan.length > 0
    ) {

        const finished =
            currentPlan[0];


        tasks =
            tasks.filter(
                task =>
                    task.name
                    !==
                    finished.name
            );

    }


    document
        .getElementById("delayAlert")
        .classList.add(
            "hidden"
        );


    alert(
        "🔄 OptiLife is re-optimising..."
    );


    optimise();

}


/* =========================================================
   SHARE
========================================================= */

function sharePlan() {

    if (
        currentPlan.length === 0
    ) {

        return;

    }


    const time =
        document
        .getElementById("totalTime")
        .textContent;


    const saved =
        document
        .getElementById("saved")
        .textContent;


    const text =

`🚀 I just optimised my day with OptiLife!

⏱️ Total time: ${time}
🔥 Time saved: ${saved}

🧠 OptiLife — Your day. Optimised.`;


    if (
        navigator.clipboard
    ) {

        navigator.clipboard
            .writeText(text)
            .then(
                () => {

                    alert(
                        "📋 Result copied! Ready to share."
                    );

                }
            );

    } else {

        alert(text);

    }

}


/* =========================================================
   DEMO TASKS
========================================================= */

tasks = [

    {

        name:
            "Gym",

        location:
            "Gym",

        duration:
            45,

        priority:
            8,

        mandatory:
            true

    },

    {

        name:
            "Shopping",

        location:
            "Shop",

        duration:
            30,

        priority:
            6,

        mandatory:
            false

    },

    {

        name:
            "Coffee",

        location:
            "Cafe",

        duration:
            20,

        priority:
            4,

        mandatory:
            false

    },

    {

        name:
            "Library",

        location:
            "Library",

        duration:
            30,

        priority:
            7,

        mandatory:
            false

    }

];


renderTasks();


</script>

</body>
</html>
