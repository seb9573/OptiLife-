<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OptiLife</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f6f8;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 30px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 34px;
}

header p {
    margin: 8px 0 0;
    opacity: 0.75;
}

main {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 18px;
    border-radius: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.06);
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    font-weight: 600;
    margin-top: 10px;
}

input,
select {
    width: 100%;
    padding: 13px;
    margin: 7px 0 15px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
    background: white;
}

button {
    border: 0;
    border-radius: 11px;
    padding: 13px 17px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.primary {
    background: #111827;
    color: white;
}

.secondary {
    background: #e5e7eb;
    color: #111827;
}

.danger {
    background: #fee2e2;
    color: #991b1b;
}

.lock-button {
    background: #ede9fe;
    color: #5b21b6;
}

.locked {
    border: 2px solid #7c3aed;
    background: #faf5ff;
}

.full {
    width: 100%;
}

.task {
    border: 1px solid #e5e7eb;
    border-radius: 13px;
    padding: 14px;
    margin-bottom: 10px;
}

.task-title {
    font-weight: bold;
    font-size: 18px;
}

.task-info {
    color: #6b7280;
    margin: 6px 0 12px;
    line-height: 1.5;
}

.task-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.empty {
    text-align: center;
    color: #6b7280;
    padding: 20px;
}

.plan-item {
    padding: 15px;
    margin: 10px 0;
    background: #f9fafb;
    border-radius: 10px;
    border-left: 4px solid #111827;
}

.plan-item.locked-plan {
    background: #faf5ff;
    border-left-color: #7c3aed;
}

.plan-item strong {
    font-size: 18px;
}

.plan-arrow {
    text-align: center;
    color: #6b7280;
    font-weight: bold;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 15px;
}

.stat {
    background: #f3f4f6;
    padding: 13px 5px;
    text-align: center;
    border-radius: 10px;
}

.stat-number {
    font-size: 20px;
    font-weight: bold;
}

.stat-label {
    font-size: 12px;
    color: #6b7280;
}

.success {
    margin-top: 15px;
    padding: 15px;
    border-radius: 12px;
    background: #ecfdf5;
}

.warning {
    margin-top: 15px;
    padding: 15px;
    border-radius: 12px;
    background: #fff7ed;
    border: 1px solid #fed7aa;
}

.hidden {
    display: none;
}

.lock-box {
    padding: 14px;
    margin-top: 10px;
    background: #faf5ff;
    border-radius: 12px;
}

.lock-box label {
    color: #5b21b6;
}

@media (max-width: 600px) {
    main {
        padding: 12px;
    }

    .stats {
        grid-template-columns: 1fr 1fr 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>🧠 OptiLife</h1>
    <p>Your day. Optimised.</p>
</header>

<main>

<!-- START -->

<div class="card">

    <h2>📍 Start</h2>

    <label>Starting location</label>

    <input
        id="start"
        placeholder="e.g. Ranelagh, Dublin"
    >

    <button
        class="secondary"
        onclick="getLocation()"
    >
        📍 Use my location
    </button>

    <p id="locationStatus"></p>

</div>


<!-- TIME -->

<div class="card">

    <h2>⏰ Available time</h2>

    <label>Minutes available</label>

    <input
        id="available"
        type="number"
        value="420"
        min="1"
    >

</div>


<!-- ADD TASK -->

<div class="card">

    <h2>➕ Add something</h2>

    <label>What are you doing?</label>

    <input
        id="name"
        placeholder="e.g. Gym"
    >

    <label>Where?</label>

    <input
        id="place"
        placeholder="e.g. Flyefit Ranelagh"
    >

    <label>How long? (minutes)</label>

    <input
        id="duration"
        type="number"
        value="30"
        min="1"
    >

    <label>Priority</label>

    <select id="priority">
        <option value="10">🔴 Essential</option>
        <option value="8">🟠 Very important</option>
        <option value="6" selected>🟡 Important</option>
        <option value="4">🟢 Nice to do</option>
        <option value="2">⚪ Optional</option>
    </select>

    <label>
        <input
            id="orderLock"
            type="checkbox"
            style="width:auto; margin-right:6px;"
            onchange="toggleLockBox()"
        >
        🔒 Order Lock
    </label>

    <div
        id="lockBox"
        class="lock-box hidden"
    >

        <label>
            Exact arrival time
        </label>

        <input
            id="lockedTime"
            type="time"
        >

        <small>
            OptiLife will keep this task fixed and
            protect enough time to reach it.
        </small>

    </div>

    <br>

    <button
        class="primary"
        onclick="addTask()"
    >
        ➕ Add task
    </button>

</div>


<!-- TASKS -->

<div class="card">

    <h2>📋 Your tasks</h2>

    <div id="tasks">

        <div class="empty">
            Nothing planned yet.<br><br>
            Add your first task above.
        </div>

    </div>

</div>


<!-- OPTIMISE -->

<div class="card">

    <button
        class="primary full"
        onclick="optimise()"
    >
        🚀 Optimise my day
    </button>

</div>


<!-- RESULT -->

<div
    id="result"
    class="card hidden"
>

    <h2>🧠 Your plan</h2>

    <div id="plan"></div>

    <div class="stats">

        <div class="stat">
            <div
                class="stat-number"
                id="total"
            >
                0m
            </div>

            <div class="stat-label">
                Total
            </div>
        </div>

        <div class="stat">
            <div
                class="stat-number"
                id="activities"
            >
                0m
            </div>

            <div class="stat-label">
                Activities
            </div>
        </div>

        <div class="stat">
            <div
                class="stat-number"
                id="remaining"
            >
                0m
            </div>

            <div class="stat-label">
                Remaining
            </div>
        </div>

    </div>

    <div
        id="message"
        class="success"
    ></div>

    <br>

    <button
        class="secondary"
        onclick="sharePlan()"
    >
        📤 Share plan
    </button>

</div>

</main>


<script>

let tasks = [];
let currentPlan = [];


/* =========================
   LOCK UI
========================= */

function toggleLockBox() {

    const checked =
        document.getElementById("orderLock").checked;

    const box =
        document.getElementById("lockBox");

    if (checked) {
        box.classList.remove("hidden");
    } else {
        box.classList.add("hidden");
    }
}


/* =========================
   ADD TASK
========================= */

function addTask() {

    const name =
        document.getElementById("name").value.trim();

    const place =
        document.getElementById("place").value.trim();

    const duration =
        Number(
            document.getElementById("duration").value
        );

    const priority =
        Number(
            document.getElementById("priority").value
        );

    const locked =
        document.getElementById("orderLock").checked;

    const lockedTime =
        document.getElementById("lockedTime").value;


    if (!name) {
        alert("Enter what you want to do.");
        return;
    }

    if (!place) {
        alert("Enter where you're going.");
        return;
    }

    if (!duration || duration < 1) {
        alert("Enter a valid duration.");
        return;
    }

    if (locked && !lockedTime) {
        alert("Choose the exact time for the Order Lock.");
        return;
    }


    tasks.push({

        id: Date.now(),

        name: name,

        place: place,

        duration: duration,

        priority: priority,

        locked: locked,

        lockedTime: lockedTime

    });


    document.getElementById("name").value = "";

    document.getElementById("place").value = "";

    document.getElementById("duration").value = "30";

    document.getElementById("orderLock").checked = false;

    document.getElementById("lockedTime").value = "";

    toggleLockBox();

    showTasks();

}


/* =========================
   SHOW TASKS
========================= */

function showTasks() {

    const box =
        document.getElementById("tasks");


    if (tasks.length === 0) {

        box.innerHTML =
            '<div class="empty">' +
            'Nothing planned yet.<br><br>' +
            'Add your first task above.' +
            '</div>';

        return;
    }


    box.innerHTML = "";


    tasks.forEach(function(task, index) {

        const item =
            document.createElement("div");


        item.className =
            task.locked
            ? "task locked"
            : "task";


        let lockText = "";

        if (task.locked) {

            lockText =
                "<br>🔒 Locked at " +
                task.lockedTime;

        }


        item.innerHTML =

            '<div class="task-title">' +

            (task.locked ? "🔒 " : "") +

            escapeHTML(task.name) +

            '</div>' +

            '<div class="task-info">' +

            '📍 ' +
            escapeHTML(task.place) +

            '<br>⏱️ ' +
            task.duration +
            ' minutes' +

            '<br>⭐ Priority ' +
            task.priority +

            lockText +

            '</div>' +

            '<div class="task-buttons">' +

            '<button class="secondary" ' +
            'onclick="directions(' +
            index +
            ')">' +
            '🗺️ Directions' +
            '</button>' +

            '<button class="danger" ' +
            'onclick="removeTask(' +
            index +
            ')">' +
            '🗑️ Remove' +
            '</button>' +

            '</div>';


        box.appendChild(item);

    });

}


/* =========================
   REMOVE
========================= */

function removeTask(index) {

    tasks.splice(index, 1);

    showTasks();

}


/* =========================
   TRAVEL ESTIMATE
========================= */

function travelEstimate() {

    /*
       Temporary conservative estimate.

       Real routing will replace this later.
    */

    return 10;

}


/* =========================
   OPTIMISE
========================= */

function optimise() {

    if (tasks.length === 0) {

        alert(
            "Add at least one task first."
        );

        return;
    }


    const available =
        Number(
            document
                .getElementById("available")
                .value
        );


    if (!available || available < 1) {

        alert(
            "Enter your available time."
        );

        return;
    }


    const lockedTasks =
        tasks
            .filter(function(task) {
                return task.locked;
            })
            .sort(function(a, b) {

                return timeToMinutes(a.lockedTime)
                    -
                    timeToMinutes(b.lockedTime);

            });


    const unlockedTasks =
        tasks
            .filter(function(task) {
                return !task.locked;
            })
            .sort(function(a, b) {

                return b.priority
                    -
                    a.priority;

            });


    /*
       No locked tasks:
       simply use priority order.
    */

    if (lockedTasks.length === 0) {

        currentPlan = [];

        let used = 0;

        unlockedTasks.forEach(function(task) {

            const cost =
                task.duration +
                travelEstimate();


            if (used + cost <= available) {

                currentPlan.push(task);

                used += cost;

            }

        });


        displayPlan(
            used,
            available,
            "No Order Locks were set."
        );

        return;
    }


    /*
       Locked tasks become anchors.

       We build around each anchor.
    */

    currentPlan = [];

    let used = 0;

    let remainingTasks =
        unlockedTasks.slice();

    let previousTime = 0;


    for (
        let i = 0;
        i < lockedTasks.length;
        i++
    ) {

        const lock =
            lockedTasks[i];


        const lockTime =
            timeToMinutes(
                lock.lockedTime
            );


        /*
           Fill space before the locked event.
        */

        while (
            remainingTasks.length > 0
        ) {

            const candidate =
                remainingTasks[0];


            const candidateCost =
                candidate.duration +
                travelEstimate();


            const nextUsed =
                used +
                candidateCost;


            /*
               Estimate how much time is
               available before the lock.
            */

            const spaceBeforeLock =
                lockTime - previousTime;


            if (
                candidateCost
                <=
                spaceBeforeLock
                &&
                nextUsed <= available
            ) {

                currentPlan.push(
                    candidate
                );

                used =
                    nextUsed;

                previousTime +=
                    candidateCost;

                remainingTasks.shift();

            } else {

                break;

            }

        }


        /*
           Add the locked task.
        */

        const lockCost =
            lock.duration;


        if (
            used + lockCost
            <=
            available
        ) {

            currentPlan.push(lock);

            used += lockCost;

        } else {

            displayPlan(
                used,
                available,
                "⚠️ The Order Lock could not fit inside your available time."
            );

            return;

        }


        previousTime =
            Math.max(
                previousTime,
                lockTime + lock.duration
            );

    }


    /*
       Fill remaining time after the
       final locked event.
    */

    remainingTasks.forEach(function(task) {

        const cost =
            task.duration +
            travelEstimate();


        if (
            used + cost
            <=
            available
        ) {

            currentPlan.push(task);

            used += cost;

        }

    });


    displayPlan(
        used,
        available,
        "🔒 Order Locks were protected."
    );

}


/* =========================
   DISPLAY PLAN
========================= */

function displayPlan(
    total,
    available,
    message
) {

    const result =
        document.getElementById("result");

    const plan =
        document.getElementById("plan");


    result.classList.remove("hidden");

    plan.innerHTML = "";


    currentPlan.forEach(function(task, index) {

        const item =
            document.createElement("div");


        item.className =
            task.locked
            ? "plan-item locked-plan"
            : "plan-item";


        let lockedText = "";

        if (task.locked) {

            lockedText =
                "<br>🔒 Arrive at " +
                task.lockedTime;

        }


        item.innerHTML =

            "<strong>" +

            (index + 1) +

            ". " +

            (task.locked ? "🔒 " : "") +

            escapeHTML(task.name) +

            "</strong>" +

            "<br>📍 " +

            escapeHTML(task.place) +

            "<br>⏱️ " +

            task.duration +

            " minutes" +

            lockedText +

            "<br><br>" +

            '<button class="secondary" ' +

            'onclick="openMap(\'' +

            encodeURIComponent(task.place) +

            '\')">' +

            "🗺️ Get directions" +

            "</button>";


        plan.appendChild(item);


        if (
            index <
            currentPlan.length - 1
        ) {

            const arrow =
                document.createElement("div");

            arrow.className =
                "plan-arrow";

            arrow.textContent =
                "↓";

            plan.appendChild(arrow);

        }

    });


    document.getElementById("total").textContent =
        total + "m";


    document.getElementById("activities").textContent =
        currentPlan.reduce(
            function(sum, task) {
                return sum + task.duration;
            },
            0
        ) + "m";


    document.getElementById("remaining").textContent =
        Math.max(
            0,
            available - total
        ) + "m";


    document.getElementById("message").innerHTML =
        escapeHTML(message) +

        "<br><br>" +

        "🎯 " +

        currentPlan.length +

        " task" +

        (
            currentPlan.length === 1
            ? ""
            : "s"
        ) +

        " planned.";

}


/* =========================
   TIME CONVERSION
========================= */

function timeToMinutes(time) {

    if (!time) {
        return 0;
    }


    const parts =
        time.split(":");


    return (
        Number(parts[0]) * 60
        +
        Number(parts[1])
    );

}


/* =========================
   DIRECTIONS
========================= */

function directions(index) {

    openMap(
        encodeURIComponent(
            tasks[index].place
        )
    );

}


function openMap(destination) {

    const start =
        document
            .getElementById("start")
            .value
            .trim();


    const origin =
        start
        ?
        encodeURIComponent(start)
        :
        "Current+Location";


    const url =
        "https://www.google.com/maps/dir/?api=1" +

        "&origin=" +
        origin +

        "&destination=" +
        destination;


    window.open(
        url,
        "_blank"
    );

}


/* =========================
   LOCATION
========================= */

function getLocation() {

    const status =
        document.getElementById(
            "locationStatus"
        );


    if (!navigator.geolocation) {

        status.textContent =
            "Location isn't supported.";

        return;

    }


    status.textContent =
        "📍 Finding you...";


    navigator.geolocation.getCurrentPosition(

        function(position) {

            document.getElementById(
                "start"
            ).value =

                position.coords.latitude
                .toFixed(5)

                +

                ", "

                +

                position.coords.longitude
                .toFixed(5);


            status.textContent =
                "✅ Location added.";

        },

        function() {

            status.textContent =
                "Couldn't access your location. Type it manually.";

        }

    );

}


/* =========================
   SHARE
========================= */

function sharePlan() {

    if (
        currentPlan.length === 0
    ) {

        alert(
            "Create a plan first."
        );

        return;

    }


    const text =

        "🧠 My OptiLife plan\n\n" +

        currentPlan
            .map(function(task, index) {

                return (

                    (index + 1) +

                    ". " +

                    task.name +

                    (

                        task.locked

                        ?

                        " 🔒 " +
                        task.lockedTime

                        :

                        ""

                    )

                );

            })
            .join("\n") +

        "\n\nYour day. Optimised.";


    if (navigator.share) {

        navigator.share({

            title:
                "My OptiLife plan",

            text:
                text

        });

    } else {

        navigator.clipboard
            .writeText(text)
            .then(function() {

                alert(
                    "📋 Plan copied!"
                );

            });

    }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================
   START EMPTY
========================= */

showTasks();

</script>

</body>
</html>
