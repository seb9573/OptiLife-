<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OptiLife</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#111827}
header{background:#111827;color:white;padding:30px 20px;text-align:center}
header h1{margin:0;font-size:34px}
header p{margin:8px 0 0;opacity:.75}
main{max-width:700px;margin:auto;padding:20px}
.card{background:white;padding:20px;margin-bottom:18px;border-radius:18px;box-shadow:0 4px 15px rgba(0,0,0,.06)}
h2{margin-top:0}
label{display:block;font-weight:600;margin-top:10px}
input,select{width:100%;padding:13px;margin:7px 0 15px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:white}
button{border:0;border-radius:11px;padding:13px 17px;font-size:16px;font-weight:bold;cursor:pointer}
.primary{background:#111827;color:white}
.secondary{background:#e5e7eb;color:#111827}
.danger{background:#fee2e2;color:#991b1b}
.lock-button{background:#ede9fe;color:#5b21b6}
.full{width:100%}
.task{border:1px solid #e5e7eb;border-radius:13px;padding:14px;margin-bottom:10px}
.task.locked{border:2px solid #7c3aed;background:#faf5ff}
.task-title{font-weight:bold;font-size:18px}
.task-info{color:#6b7280;margin:6px 0 12px;line-height:1.5}
.task-buttons{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:#6b7280;padding:20px}
.lock-box{padding:14px;margin-top:10px;background:#faf5ff;border-radius:12px}
.plan-item{padding:15px;margin:10px 0;background:#f9fafb;border-radius:10px;border-left:4px solid #111827}
.plan-item.locked-plan{background:#faf5ff;border-left-color:#7c3aed}
.plan-item strong{font-size:18px}
.plan-arrow{text-align:center;color:#6b7280;font-weight:bold}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}
.stat{background:#f3f4f6;padding:13px 5px;text-align:center;border-radius:10px}
.stat-number{font-size:20px;font-weight:bold}
.stat-label{font-size:12px;color:#6b7280}
.success{margin-top:15px;padding:15px;border-radius:12px;background:#ecfdf5}
.warning{margin-top:15px;padding:15px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa}
.hidden{display:none}
.small{font-size:13px;color:#6b7280}
@media(max-width:600px){main{padding:12px}}
</style>
</head>

<body>

<header>
<h1>🧠 OptiLife</h1>
<p>Your day. Optimised.</p>
</header>

<main>

<div class="card">
<h2>📍 Start</h2>

<label>Starting location</label>
<input id="start" placeholder="e.g. Drogheda, Ireland">

<button class="secondary" onclick="getLocation()">📍 Use my location</button>
<p id="locationStatus"></p>
</div>

<div class="card">
<h2>⏰ Available time</h2>

<label>Hours</label>
<input id="availableHours" type="number" min="0" value="7">

<label>Minutes</label>
<input id="availableMinutes" type="number" min="0" max="59" value="0">

<p class="small">Example: 2 hours 30 minutes</p>
</div>

<div class="card">
<h2>➕ Add something</h2>

<label>What are you doing?</label>
<input id="name" placeholder="e.g. Gym">

<label>Where?</label>
<input id="place" placeholder="e.g. Flyefit">

<label>How long?</label>

<div style="display:flex;gap:8px">
<input id="durationHours" type="number" min="0" value="0" placeholder="Hours">
<input id="durationMinutes" type="number" min="0" max="59" value="30" placeholder="Minutes">
</div>

<label>Priority</label>
<select id="priority">
<option value="10">🔴 Essential</option>
<option value="8">🟠 Very important</option>
<option value="6" selected>🟡 Important</option>
<option value="4">🟢 Nice to do</option>
<option value="2">⚪ Optional</option>
</select>

<label>
<input id="orderLock" type="checkbox" style="width:auto" onchange="toggleLockBox()">
🔒 Order Lock
</label>

<div id="lockBox" class="lock-box hidden">

<label>Exact time</label>
<input id="lockedTime" type="time">

<label>Reminder</label>
<select id="reminder">
<option value="0">No reminder</option>
<option value="5">5 minutes before</option>
<option value="10">10 minutes before</option>
<option value="15">15 minutes before</option>
<option value="30">30 minutes before</option>
</select>

<p class="small">
OptiLife will keep this event fixed.
</p>

</div>

<br>

<button class="primary" onclick="addTask()">➕ Add task</button>
</div>

<div class="card">
<h2>📋 Your tasks</h2>
<div id="tasks"></div>
</div>

<div class="card">

<button class="primary full" onclick="requestNotifications()">
🔔 Enable notifications
</button>

<br><br>

<button class="primary full" onclick="optimise()">
🚀 Optimise my day
</button>

</div>

<div id="result" class="card hidden">

<h2>🧠 Your plan</h2>

<div id="plan"></div>

<div class="stats">

<div class="stat">
<div class="stat-number" id="total">0m</div>
<div class="stat-label">Total</div>
</div>

<div class="stat">
<div class="stat-number" id="activities">0m</div>
<div class="stat-label">Activities</div>
</div>

<div class="stat">
<div class="stat-number" id="remaining">0m</div>
<div class="stat-label">Remaining</div>
</div>

</div>

<div id="message" class="success"></div>

<br>

<button class="secondary" onclick="sharePlan()">📤 Share plan</button>

</div>

</main>

<script>

let tasks=[];
let currentPlan=[];

function formatTime(minutes){

    minutes=Math.max(0,Math.round(minutes));

    const hours=Math.floor(minutes/60);
    const mins=minutes%60;

    if(hours===0){
        return mins+" minute"+(mins===1?"":"s");
    }

    if(mins===0){
        return hours+" hour"+(hours===1?"":"s");
    }

    return hours+" hour"+(hours===1?"":"s")+" "+
           mins+" minute"+(mins===1?"":"s");
}

function getAvailable(){

    const h=Number(document.getElementById("availableHours").value)||0;
    const m=Number(document.getElementById("availableMinutes").value)||0;

    return h*60+m;
}

function getDuration(){

    const h=Number(document.getElementById("durationHours").value)||0;
    const m=Number(document.getElementById("durationMinutes").value)||0;

    return h*60+m;
}

function toggleLockBox(){

    const checked=document.getElementById("orderLock").checked;
    document.getElementById("lockBox").classList.toggle("hidden",!checked);

}

async function requestNotifications(){

    if(!("Notification" in window)){

        alert("Notifications aren't supported by this browser.");

        return;
    }

    const permission=await Notification.requestPermission();

    if(permission==="granted"){

        new Notification("🧠 OptiLife notifications enabled!",{
            body:"You'll receive reminders for supported events."
        });

    }else{

        alert("Notification permission wasn't granted.");

    }
}

function addTask(){

    const name=document.getElementById("name").value.trim();
    const place=document.getElementById("place").value.trim();
    const duration=getDuration();
    const priority=Number(document.getElementById("priority").value);

    const locked=document.getElementById("orderLock").checked;
    const lockedTime=document.getElementById("lockedTime").value;
    const reminder=Number(document.getElementById("reminder").value);

    if(!name){
        alert("Enter what you want to do.");
        return;
    }

    if(!place){
        alert("Enter where you're going.");
        return;
    }

    if(duration<1){
        alert("Enter a valid duration.");
        return;
    }

    if(locked&&!lockedTime){
        alert("Choose the exact time for the Order Lock.");
        return;
    }

    tasks.push({
        id:Date.now(),
        name,
        place,
        duration,
        priority,
        locked,
        lockedTime,
        reminder
    });

    saveTasks();

    document.getElementById("name").value="";
    document.getElementById("place").value="";
    document.getElementById("durationHours").value=0;
    document.getElementById("durationMinutes").value=30;
    document.getElementById("orderLock").checked=false;
    document.getElementById("lockedTime").value="";
    document.getElementById("reminder").value=0;

    toggleLockBox();
    showTasks();
}

function showTasks(){

    const box=document.getElementById("tasks");

    if(tasks.length===0){

        box.innerHTML='<div class="empty">Nothing planned yet.<br><br>Add your first task above.</div>';

        return;
    }

    box.innerHTML="";

    tasks.forEach((task,index)=>{

        const item=document.createElement("div");

        item.className="task"+(task.locked?" locked":"");

        item.innerHTML=`

        <div class="task-title">
        ${task.locked?"🔒 ":""}${escapeHTML(task.name)}
        </div>

        <div class="task-info">

        📍 ${escapeHTML(task.place)}

        <br>

        ⏱️ ${formatTime(task.duration)}

        ${task.locked?`<br>🔒 ${task.lockedTime}`:""}

        ${task.reminder?
        `<br>🔔 ${task.reminder} minutes before`:""}

        <br>

        ⭐ Priority ${task.priority}

        </div>

        <div class="task-buttons">

        <button class="secondary"
        onclick="directions(${index})">
        🗺️ Directions
        </button>

        <button class="danger"
        onclick="removeTask(${index})">
        🗑️ Remove
        </button>

        </div>`;

        box.appendChild(item);

    });
}

function removeTask(index){

    tasks.splice(index,1);

    saveTasks();
    showTasks();

}

function travelEstimate(){
    return 10;
}

function timeToMinutes(time){

    if(!time)return 0;

    const parts=time.split(":");

    return Number(parts[0])*60+Number(parts[1]);

}

function optimise(){

    if(tasks.length===0){

        alert("Add at least one task first.");
        return;

    }

    const available=getAvailable();

    if(available<1){

        alert("Enter your available time.");
        return;

    }

    const lockedTasks=tasks
        .filter(t=>t.locked)
        .sort((a,b)=>timeToMinutes(a.lockedTime)-timeToMinutes(b.lockedTime));

    const unlockedTasks=tasks
        .filter(t=>!t.locked)
        .sort((a,b)=>b.priority-a.priority);

    currentPlan=[];
    let used=0;

    if(lockedTasks.length===0){

        for(const task of unlockedTasks){

            const cost=task.duration+travelEstimate();

            if(used+cost<=available){

                currentPlan.push(task);
                used+=cost;

            }

        }

        displayPlan(used,available,"No Order Locks were set.");

        return;
    }

    let remaining=unlockedTasks.slice();
    let previousTime=0;

    for(const lock of lockedTasks){

        const lockTime=timeToMinutes(lock.lockedTime);

        while(remaining.length){

            const candidate=remaining[0];

            const cost=candidate.duration+travelEstimate();

            if(
                cost<=lockTime-previousTime &&
                used+cost<=available
            ){

                currentPlan.push(candidate);
                used+=cost;
                previousTime+=cost;
                remaining.shift();

            }else{

                break;

            }
        }

        if(used+lock.duration>available){

            displayPlan(
                used,
                available,
                "⚠️ The Order Lock could not fit inside your available time."
            );

            return;

        }

        currentPlan.push(lock);

        used+=lock.duration;

        previousTime=Math.max(
            previousTime,
            lockTime+lock.duration
        );
    }

    for(const task of remaining){

        const cost=task.duration+travelEstimate();

        if(used+cost<=available){

            currentPlan.push(task);
            used+=cost;

        }
    }

    displayPlan(
        used,
        available,
        "🔒 Order Locks were protected."
    );

    scheduleReminders();

}

function displayPlan(total,available,message){

    const result=document.getElementById("result");
    const plan=document.getElementById("plan");

    result.classList.remove("hidden");
    plan.innerHTML="";

    currentPlan.forEach((task,index)=>{

        const item=document.createElement("div");

        item.className="plan-item"+(task.locked?" locked-plan":"");

        item.innerHTML=`

        <strong>
        ${index+1}. ${task.locked?"🔒 ":""}${escapeHTML(task.name)}
        </strong>

        <br>

        📍 ${escapeHTML(task.place)}

        <br>

        ⏱️ ${formatTime(task.duration)}

        ${task.locked?
        `<br>🔒 Arrive at ${task.lockedTime}`:""}

        ${task.reminder?
        `<br>🔔 Reminder ${task.reminder} minutes before`:""}

        <br><br>

        <button class="secondary"
        onclick="openMap('${encodeURIComponent(task.place)}')">
        🗺️ Get directions
        </button>`;

        plan.appendChild(item);

        if(index<currentPlan.length-1){

            const arrow=document.createElement("div");

            arrow.className="plan-arrow";
            arrow.textContent="↓";

            plan.appendChild(arrow);

        }

    });

    document.getElementById("total").textContent=formatTime(total);

    const activityTime=currentPlan.reduce(
        (sum,task)=>sum+task.duration,0
    );

    document.getElementById("activities").textContent=formatTime(activityTime);

    document.getElementById("remaining").textContent=
        formatTime(Math.max(0,available-total));

    document.getElementById("message").innerHTML=
        escapeHTML(message)+
        "<br><br>🎯 "+
        currentPlan.length+
        " task"+
        (currentPlan.length===1?"":"s")+
        " planned.";

}

function scheduleReminders(){

    if(!("Notification" in window))return;

    if(Notification.permission!=="granted")return;

    currentPlan.forEach(task=>{

        if(!task.locked||!task.reminder)return;

        const parts=task.lockedTime.split(":");

        const now=new Date();

        const event=new Date();

        event.setHours(
            Number(parts[0]),
            Number(parts[1]),
            0,
            0
        );

        const reminderTime=
            event.getTime()-
            task.reminder*60*1000;

        const delay=
            reminderTime-now.getTime();

        if(delay>0){

            setTimeout(()=>{

                new Notification(
                    "🔒 OptiLife reminder",
                    {
                        body:
                        `${task.name} starts at ${task.lockedTime}.`
                    }
                );

            },delay);

        }

    });

}

function directions(index){

    openMap(
        encodeURIComponent(tasks[index].place)
    );

}

function openMap(destination){

    const start=document
        .getElementById("start")
        .value
        .trim();

    const origin=start?
        encodeURIComponent(start):
        "Current+Location";

    const url=
        "https://www.google.com/maps/dir/?api=1"+
        "&origin="+origin+
        "&destination="+destination;

    window.open(url,"_blank");

}

function getLocation(){

    const status=document.getElementById("locationStatus");

    if(!navigator.geolocation){

        status.textContent="Location isn't supported.";
        return;

    }

    status.textContent="📍 Finding you...";

    navigator.geolocation.getCurrentPosition(

        position=>{

            document.getElementById("start").value=
                position.coords.latitude.toFixed(5)+
                ", "+
                position.coords.longitude.toFixed(5);

            status.textContent="✅ Location added.";

        },

        ()=>{
            status.textContent=
                "Couldn't access your location. Type it manually.";
        }

    );

}

function sharePlan(){

    if(!currentPlan.length){

        alert("Create a plan first.");
        return;

    }

    const text=
        "🧠 My OptiLife plan\n\n"+
        currentPlan.map((task,index)=>
            `${index+1}. ${task.name}`+
            (task.locked?" 🔒 "+task.lockedTime:"")+
            ` — ${formatTime(task.duration)}`
        ).join("\n")+
        "\n\nYour day. Optimised.";

    if(navigator.share){

        navigator.share({
            title:"My OptiLife plan",
            text
        });

    }else{

        navigator.clipboard.writeText(text);

        alert("📋 Plan copied!");

    }

}

function saveTasks(){

    localStorage.setItem(
        "optLifeTasks",
        JSON.stringify(tasks)
    );

}

function loadTasks(){

    try{

        const saved=
            localStorage.getItem("optLifeTasks");

        if(saved){

            tasks=JSON.parse(saved);

        }

    }catch(error){

        tasks=[];

    }

}

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

if("serviceWorker" in navigator){

    window.addEventListener("load",()=>{

        navigator.serviceWorker.register("sw.js")
        .catch(error=>{
            console.log("Service worker registration failed:",error);
        });

    });

}

loadTasks();
showTasks();

</script>

</body>
</html>
